<script>
(function () {
  'use strict';
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var isMobile = isIOS || isAndroid;

  /* ---------- 1. 先还原路由：?r=1&h=p%3Darticle-1 -> #p=article-1 ---------- */
  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('r') === '1') {
      var h = qs.get('h') || '';
      var clean = location.pathname + (h ? '#' + decodeURIComponent(h) : '');
      try { history.replaceState(null, '', clean); } catch (e) { location.replace(clean); }
    }
  } catch (e) {}

  /* ---------- 2. 识别 APP ---------- */
  var APP = '', NAME = '';
  if (/FBAN|FBAV|FB_IAB|FB4A|FBIOS|\[FB/i.test(ua)) { APP = 'fb'; NAME = 'Facebook'; }
  else if (/Instagram/i.test(ua)) { APP = 'ig'; NAME = 'Instagram'; }
  else if (/Telegram|TelegramBot/i.test(ua)) { APP = 'tg'; NAME = 'Telegram'; }
  else if (/MicroMessenger/i.test(ua)) { APP = 'wx'; NAME = '微信'; }
  else if (/QQ\//i.test(ua) || /QQBrowser/i.test(ua)) { APP = 'qq'; NAME = 'QQ'; }
  else if (/BytedanceWebview|aweme|TikTok|musical_ly/i.test(ua)) { APP = 'tt'; NAME = '抖音 / TikTok'; }
  else if (/Line\//i.test(ua)) { APP = 'line'; NAME = 'LINE'; }
  else if (/Twitter/i.test(ua)) { APP = 'tw'; NAME = 'X'; }
  else if (/Weibo/i.test(ua)) { APP = 'wb'; NAME = '微博'; }
  else if (/; wv\)/i.test(ua)) { APP = 'wv'; NAME = '应用'; }

  var INAPP = !!APP;
  var forcedStay = /[?&]stay=1/.test(location.search);

  /* ---------- 3. 记录站内页面，跳出后能回到同一页 ---------- */
  var lastSlug = (location.hash.match(/^#p=([a-z0-9-]+)/i) || [])[1] || '';
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (d && d.__eqNav) lastSlug = String(d.__eqNav).replace(/^p=/, '');
  });
  window.addEventListener('hashchange', function () {
    var m = location.hash.match(/^#p=([a-z0-9-]+)/i);
    if (m) lastSlug = m[1];
  });

  function targetURL() {
    var slug = lastSlug || 'home';
    return location.origin + location.pathname + '?r=1&h=' + encodeURIComponent('p=' + slug);
  }
  var bare = function (u) { return u.replace(/^https?:\/\//i, ''); };
  var safariURI = function (u) { return 'x-safari-https://' + bare(u); };
  var chromeIOSURI = function (u) { return 'googlechromes://' + bare(u); };
  function intentURI(u, pkg) {
    var m = /^(https?):\/\/([^\/?#]+)([^?#]*)(\?[^#]*)?/i.exec(u);
    if (!m) return u;
    return 'intent://' + m[2] + (m[3] || '/') + (m[4] || '') + '#Intent;scheme=' +
      m[1].toLowerCase() + (pkg ? ';package=' + pkg : '') +
      ';S.browser_fallback_url=' + encodeURIComponent(u) + ';end';
  }

  /* ---------- 4. 绑定 ---------- */
  var box = document.getElementById('xb');
  var cta = document.getElementById('xb-cta');
  var alt = document.getElementById('xb-alt');
  var steps = document.getElementById('xb-steps');
  var appLbl = document.getElementById('xb-app');
  if (!box || !cta) return;

  function paint() {
    var t = targetURL();
    if (isIOS) {
      cta.href = safariURI(t);
      cta.textContent = '在 Safari 中打开';
      alt.href = chromeIOSURI(t);
      alt.textContent = '用 Chrome 打开';
      alt.style.display = '';
    } else if (isAndroid) {
      cta.href = intentURI(t, '');
      cta.textContent = '在默认浏览器中打开';
      alt.href = intentURI(t, 'com.android.chrome');
      alt.textContent = '用 Chrome 打开';
      alt.style.display = '';
    } else {
      cta.href = t;
      cta.textContent = '打开链接';
      alt.style.display = 'none';
    }
    if (appLbl) appLbl.textContent = NAME || '应用';
    var s = '';
    if (APP === 'fb') {
      s = isIOS
        ? '如果按钮没反应：点右下角 <i>⋯</i> 或 <i>分享</i> → <i>在 Safari 中打开</i>'
        : '如果按钮没反应：点右上角 <i>⋯</i> → <i>在浏览器中打开</i>';
    } else if (APP === 'ig') {
      s = '如果按钮没反应：点右上角 <i>⋯</i> → <i>在浏览器中打开</i>';
    } else if (APP === 'tg') {
      s = '如果按钮没反应：点右上角 <i>⋯</i> → <i>在浏览器中打开</i>（没有该项时用下方「复制链接」粘到浏览器）';
    } else if (APP === 'wx' || APP === 'qq') {
      s = '微信 / QQ 会拦截直接跳转：点右上角 <i>⋯</i> → <i>复制链接</i>，再打开浏览器粘贴访问。';
    } else if (APP === 'tt') {
      s = '抖音会拦截直接跳转：点右上角 <i>⋯</i> → <i>复制链接</i>，再打开浏览器粘贴访问。';
    } else {
      s = '如果按钮没反应：用 <i>⋯</i> 菜单选择「在浏览器中打开」，或复制链接到浏览器粘贴。';
    }
    if (!isMobile) s = '复制链接到浏览器打开即可。';
    steps.innerHTML = s;
  }
  paint();

  function show() { if (!forcedStay) box.classList.add('on'); }
  function hide() { box.classList.remove('on'); }

  /* ---------- 5. iOS 无法静默跳转，只能给一次点击 ---------- */
  if (INAPP && isIOS) {
    setTimeout(show, 350);
  }

  /* ---------- 6. Android 先静默试 intent，没跳走再给遮罩 ---------- */
  if (INAPP && isAndroid) {
    try { location.href = intentURI(targetURL(), ''); } catch (e) {}
    setTimeout(show, 1600);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) hide();
    });
  }

  document.getElementById('xb-skip').addEventListener('click', hide);
  document.getElementById('xb-close').addEventListener('click', hide);

  document.getElementById('xb-copy').addEventListener('click', function () {
    var t = targetURL();
    var btn = this;
    var done = function () { btn.textContent = '已复制'; setTimeout(function () { btn.textContent = '复制链接'; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, function () { legacyCopy(t, done); });
    } else { legacyCopy(t, done); }
  });

  function legacyCopy(text, cb) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      cb();
    } catch (e) {}
  }

  /* ---------- 7. 站内链接点击时保持 lastSlug 最新 ---------- */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href*="#p="]') : null;
    if (a) {
      var m = a.getAttribute('href').match(/#p=([a-z0-9-]+)/i);
      if (m) lastSlug = m[1];
    }
  }, true);
})();
</script>

ose h3:first-child{margin-top:0}\n  .prose p{font-size:16.5px;line-height:1.85;color:var(--muted);margin-top:14px}\n  .prose strong{color:var(--ink)}\n  .prose em{color:var(--accent);font-style:italic}\n  .honest{margin-top:44px;text-align:left;border:1px solid var(--hairline);padding:32px;background:#fff}\n  .honest h3{font-family:var(--display);font-size:20px;font-weight:600;color:var(--accent);margin-bottom:14px}\n  .honest ul{list-style:none}\n  .honest li{font-size:15px;color:var(--muted);padding:12px 0;border-top:1px solid var(--hairline);line-height:1.7}\n  .honest li:first-child{border-top:none}\n  .reading{margin-top:48px;text-align:left}\n  .reading__label{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}\n  .reading__grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--hairline);background:#fff}\n  .reading-card{padding:26px;border-left:1px solid var(--hairline)}\n  .reading-card:first-child{border-left:none}\n  .reading-card:hover .reading-card__title{color:var(--accent)}\n  .reading-card__tag{font-size:11px;color:var(--accent);font-style:italic}\n  .reading-card__title{font-family:var(--display);font-size:19px;font-weight:600;margin-top:10px;line-height:1.3;transition:.2s}\n  .reading-card__more{font-size:13px;color:var(--muted);margin-top:10px}\n  @media(max-width:640px){.reading__grid{grid-template-columns:1fr}.reading-card{border-left:none;border-top:1px solid var(--hairline)}.reading-card:first-child{border-top:none}}\n\n  .footer{border-top:1px solid var(--hairline);padding:48px 0;margin-top:56px;text-align:center}\n  .footer__brand{font-family:var(--display);font-weight:600;letter-spacing:.18em;font-size:14px}\n  .footer__note{font-size:12.5px;color:var(--faint);margin-top:12px;max-width:56ch;margin-left:auto;margin-right:auto;line-height:1.65;font-style:italic}\n  .footer__copy{font-size:11px;color:var(--faint);margin-top:20px;letter-spacing:.08em}\n\n  @media(max-width:760px){\n    .stats{gap:28px}\n    .steps{grid-template-columns:1fr}\n    .step{border-left:none;border-top:1px solid var(--hairline)}\n    .step:first-child{border-top:none}\n    .nav__links a:not(.nav__cta){display:none}\n    .paper{flex-direction:column;gap:6px}\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"progress\" id=\"progress\">\u003c/div>\n\n\u003cnav class=\"nav\">\n  \u003cdiv class=\"container nav__inner\">\n    \u003ca href=\"#\" class=\"brand\">VITAE\u003csmall>Longevity Science\u003c/small>\u003c/a>\n    \u003cul class=\"nav__links\">\n      \u003cli>\u003ca href=\"#pipeline\">The pipeline\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#research\">The research\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#access\" class=\"nav__cta\">Back the science\u003c/a>\u003c/li>\n    \u003c/ul>\n  \u003c/div>\n\u003c/nav>\n\n\u003cheader class=\"hero\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"eyebrow rv\">Biology is the next asset class\u003c/div>\n    \u003ch1 class=\"hero__title rv\">You can now own the science\u003cbr>that decides \u003cem>how long you live\u003c/em>.\u003c/h1>\n    \u003cp class=\"hero__dek rv\">The research that decides how you age used to be locked behind lab doors. Now it trades — and the early window is closing. Capital is already moving in.\u003c/p>\n    \u003cp class=\"hero__note rv\">early-stage · private allocation · not a supplement — a stake in the science\u003c/p>\n    \u003cdiv class=\"clock rv\">\n      \u003cdiv class=\"clock__head\">\u003cspan>Your biological clock\u003c/span>\u003cspan class=\"clock__tag\">Illustrative\u003c/span>\u003c/div>\n      \u003cdiv class=\"clock__ages\">\n        \u003cdiv class=\"clock__age\">\u003cspan class=\"clock__age-num\">45\u003c/span>\u003cspan class=\"clock__age-label\">Calendar age\u003c/span>\u003c/div>\n        \u003cdiv class=\"clock__gap\">\u003cspan class=\"clock__gap-num\">+13 yrs\u003c/span>\u003cspan class=\"clock__gap-label\">you can't see in a mirror\u003c/span>\u003c/div>\n        \u003cdiv class=\"clock__age\">\u003cspan class=\"clock__age-num is-bio\">58\u003c/span>\u003cspan class=\"clock__age-label\">Biological age\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"clock__track\">\u003cdiv class=\"clock__zone\">\u003c/div>\u003cdiv class=\"clock__dot\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"clock__scale\">\u003cspan>Calendar\u003c/span>\u003cspan>Biological\u003c/span>\u003c/div>\n      \u003cdiv class=\"clock__foot\">The cells that decide this gap are now a market you can enter.\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"hero__ctas rv\">\n      \u003ca href=\"#pipeline\" class=\"btn btn--primary\">See what you could own\u003c/a>\n      \u003ca href=\"#research\" class=\"btn btn--ghost\">Read the research\u003c/a>\n    \u003c/div>\n    \u003cp class=\"hero__note rv\">on this page — the pipeline · how DeSci works · the research · the honest part\u003c/p>\n  \u003c/div>\n\u003c/header>\n\n\u003cdiv class=\"rule\">\u003chr>\u003c/div>\n\n\u003csection class=\"section\" id=\"pipeline\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"section__label rv\">The Pipeline\u003c/div>\n    \u003ch2 class=\"section__title rv\">Explore the research\u003c/h2>\n    \u003cp class=\"section__lede rv\">Four programs. One thesis — the mechanisms of aging are addressable, and now they're ownable. Over $65M has already been committed to longevity and neurotech vehicles.\u003c/p>\n    \u003cdiv class=\"explorer rv\" data-tabs>\n      \u003cdiv class=\"tabs\">\n        \u003cbutton class=\"tab is-active\" data-tab=\"senolytics\">Senolytics\u003c/button>\n        \u003cbutton class=\"tab\" data-tab=\"mitochondria\">Mitochondria\u003c/button>\n        \u003cbutton class=\"tab\" data-tab=\"epigenetic\">Epigenetic clocks\u003c/button>\n        \u003cbutton class=\"tab\" data-tab=\"neuro\">Neuroprotection\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"panel is-active\" data-panel=\"senolytics\">\u003cdiv class=\"panel__stage\">Stage 0 · Preclinical\u003c/div>\u003cdiv class=\"panel__title\">Senolytic candidates\u003c/div>\u003cdiv class=\"panel__text\">Clearing the senescent cells that accumulate with age and drive much of what we call aging — the \"zombie cells\" that stop dividing but refuse to die.\u003c/div>\u003cdiv class=\"panel__status\">In active development\u003c/div>\u003c/div>\n      \u003cdiv class=\"panel\" data-panel=\"mitochondria\">\u003cdiv class=\"panel__stage\">Stage 1 · Phase I\u003c/div>\u003cdiv class=\"panel__title\">Mitochondrial function\u003c/div>\u003cdiv class=\"panel__text\">Restoring the energy engines that decline first with age — the cellular machinery behind the fatigue most people mistake for \"just getting older.\"\u003c/div>\u003cdiv class=\"panel__status\">In active development\u003c/div>\u003c/div>\n      \u003cdiv class=\"panel\" data-panel=\"epigenetic\">\u003cdiv class=\"panel__stage\">Stage 2 · Validation\u003c/div>\u003cdiv class=\"panel__title\">Epigenetic clocks\u003c/div>\u003cdiv class=\"panel__text\">Measuring biological age — so the science can be proven, not claimed. The measuring stick that turns \"younger than my age\" into a number.\u003c/div>\u003cdiv class=\"panel__status\">In active development\u003c/div>\u003c/div>\n      \u003cdiv class=\"panel\" data-panel=\"neuro\">\u003cdiv class=\"panel__stage\">Stage 0 · Preclinical\u003c/div>\u003cdiv class=\"panel__title\">Neuroprotection\u003c/div>\u003cdiv class=\"panel__text\">Defending cognition against age-related decline — the sharpness that separates a long life from a long, clear one.\u003c/div>\u003cdiv class=\"panel__status\">In active development\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"how\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"section__label rv\">How DeSci works\u003c/div>\n    \u003ch2 class=\"section__title rv\">From lab bench to your position\u003c/h2>\n    \u003cdiv class=\"steps rv\">\n      \u003cdiv class=\"step\">\u003cdiv class=\"step__num\">01\u003c/div>\u003cdiv class=\"step__title\">Discover\u003c/div>\u003cdiv class=\"step__text\">Research is proposed, reviewed and selected on-chain — open to scrutiny, not hidden in a grant drawer.\u003c/div>\u003c/div>\n      \u003cdiv class=\"step\">\u003cdiv class=\"step__num\">02\u003c/div>\u003cdiv class=\"step__title\">Fund\u003c/div>\u003cdiv class=\"step__text\">Backing is tokenized as IP. You hold a liquid stake, not a locked donation.\u003c/div>\u003c/div>\n      \u003cdiv class=\"step\">\u003cdiv class=\"step__num\">03\u003c/div>\u003cdiv class=\"step__title\">Own\u003c/div>\u003cdiv class=\"step__text\">As the science advances, your position tracks it — with the option to exit, not wait a decade.\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"research\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"section__label rv\">The Research\u003c/div>\n    \u003ch2 class=\"section__title rv\">Built on published science\u003c/h2>\n    \u003cp class=\"section__lede rv\">This isn't a wellness brand. Every program traces back to peer-reviewed work — a representative selection below.\u003c/p>\n    \u003cdiv class=\"papers rv\">\n      \u003cdiv class=\"paper\">\u003cdiv class=\"paper__num\">i.\u003c/div>\u003cdiv>\u003cdiv class=\"paper__title\">Cellular senescence and the aging phenotype\u003c/div>\u003cdiv class=\"paper__meta\">Nature Reviews · Molecular Cell Biology\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"paper\">\u003cdiv class=\"paper__num\">ii.\u003c/div>\u003cdiv>\u003cdiv class=\"paper__title\">Mitochondrial dysfunction in age-related metabolic decline\u003c/div>\u003cdiv class=\"paper__meta\">Cell Metabolism\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"paper\">\u003cdiv class=\"paper__num\">iii.\u003c/div>\u003cdiv>\u003cdiv class=\"paper__title\">Epigenetic clocks as biomarkers of biological age\u003c/div>\u003cdiv class=\"paper__meta\">Aging (Albany NY)\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"paper\">\u003cdiv class=\"paper__num\">iv.\u003c/div>\u003cdiv>\u003cdiv class=\"paper__title\">Neuroprotection and cognitive resilience in aging\u003c/div>\u003cdiv class=\"paper__meta\">The Journal of Neuroscience\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"papers__foot\">Representative foundational literature. Full references available to allocated participants.\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"dive\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"section__label rv\">The Deep Dive\u003c/div>\n    \u003ch2 class=\"section__title rv\">What \"owning the science\" actually means\u003c/h2>\n    \u003cdiv class=\"prose rv\">\n      \u003ch3>A molecule is not a product.\u003c/h3>\n      \u003cp>Longevity has been sold to you as a supplement — a pill on a shelf, a promise on a label. That's the wrong frame. The real asset is the \u003cstrong>intellectual property\u003c/strong>: the patent on a senolytic candidate, the data behind a mitochondrial program, the biomarker clock that measures whether any of it works. For decades that IP was locked inside a lab, owned by a biotech's balance sheet, inaccessible to almost everyone.\u003c/p>\n      \u003ch3>DeSci turns that IP into a \u003cem>position\u003c/em>.\u003c/h3>\n      \u003cp>Instead of a donation to science, or a bet on a company's stock years later, the IP itself is tokenized. You hold a stake in a specific program — say, senolytics — from the preclinical stage onward. When the science advances, the position tracks it. When you want out, the position is \u003cstrong>liquid\u003c/strong>, rather than locked in a VC fund for a decade. Sei Foundation's $65M Sapien Capital is already pointed at longevity and neurotech as of 2026.\u003c/p>\n      \u003ch3>The pipeline is a ladder of risk.\u003c/h3>\n      \u003cp>Preclinical is high risk, high entry. Phase I de-risks a little. Validation — proving the biomarker actually moves — de-risks more. The point of a pipeline isn't one moonshot; it's \u003cstrong>spreading a thesis across stages\u003c/strong>, so you're not betting everything on a single molecule clearing the clinic.\u003c/p>\n      \u003cp>The honest version: you're not buying a longer life. You're buying early, liquid access to the science that might move the needle — with all the risk that \"early\" implies.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"honest\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"section__label rv\">The Honest Part\u003c/div>\n    \u003ch2 class=\"section__title rv\">Read this first\u003c/h2>\n    \u003cdiv class=\"honest rv\">\n      \u003ch3>What no one wants to say about early biotech.\u003c/h3>\n      \u003cul>\n        \u003cli>Most drug candidates fail. The base rate is brutal — full loss is possible, and common.\u003c/li>\n        \u003cli>This is not a medical treatment and not a promise of lifespan extension. No one here is selling health outcomes.\u003c/li>\n        \u003cli>Early-stage positions are volatile and can take years to mature. \"Liquid\" does not mean \"stable.\"\u003c/li>\n        \u003cli>If you want near-term certainty, or can't hold through years of failure, this isn't for you.\u003c/li>\n        \u003cli>For accredited / sophisticated investors only, on a long horizon.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"faq\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"section__label rv\">The Questions\u003c/div>\n    \u003ch2 class=\"section__title rv\">Asked, answered.\u003c/h2>\n    \u003cdiv class=\"faq rv\">\n      \u003cdetails>\u003csummary>Is this a supplement?\u003c/summary>\u003cp>No. VITAE is a stake in the research itself — tokenized biotech IP, not a product you take.\u003c/p>\u003c/details>\n      \u003cdetails>\u003csummary>How liquid is it?\u003c/summary>\u003cp>Tokenized IP trades. Historically, biotech positions were locked for a decade; DeSci makes them liquid.\u003c/p>\u003c/details>\n      \u003cdetails>\u003csummary>What stage is the science?\u003c/summary>\u003cp>Early — preclinical and Phase I. That's the point: early entry is where the access (and the risk) lives.\u003c/p>\u003c/details>\n      \u003cdetails>\u003csummary>Who can access it?\u003c/summary>\u003cp>Accredited / sophisticated investors only. Allocations are private and limited.\u003c/p>\u003c/details>\n      \u003cdetails>\u003csummary>What's the risk?\u003c/summary>\u003cp>Early-stage biotech. Full loss is possible, as with any pre-revenue research.\u003c/p>\u003c/details>\n      \u003cdetails>\u003csummary>Why DeSci over a VC fund?\u003c/summary>\u003cp>Direct ownership, liquidity, and alignment — your health and your capital point the same direction.\u003c/p>\u003c/details>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"reading\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"reading__label rv\">Keep reading\u003c/div>\n    \u003cdiv class=\"reading__grid rv\">\n      \u003ca class=\"reading-card\" href=\"#p=article-1\">\u003cdiv class=\"reading-card__tag\">The thesis\u003c/div>\u003cdiv class=\"reading-card__title\">Why most molecules die before the clinic\u003c/div>\u003cdiv class=\"reading-card__more\">The failure rate isn't a bug. →\u003c/div>\u003c/a>\n      \u003ca class=\"reading-card\" href=\"#p=article-2\">\u003cdiv class=\"reading-card__tag\">Explainers\u003c/div>\u003cdiv class=\"reading-card__title\">What an IP-NFT actually is\u003c/div>\u003cdiv class=\"reading-card__more\">Three words, no jargon. →\u003c/div>\u003c/a>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"access\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"section__label rv\">Private Allocation\u003c/div>\n    \u003ch2 class=\"section__title rv\">Request access to the pipeline\u003c/h2>\n    \u003cp class=\"section__lede rv\">VITAE allocations are private and limited. Leave your details and we'll share what's currently open.\u003c/p>\n    \u003cform class=\"report-form rv\" action=\"https://formspree.io/f/YOUR_FORM_ID\" method=\"POST\">\n      \u003cinput type=\"text\" name=\"name\" placeholder=\"Your name\" aria-label=\"Name\" required>\n      \u003cinput type=\"email\" name=\"email\" placeholder=\"Email address\" aria-label=\"Email\" required>\n      \u003cbutton type=\"submit\" class=\"btn btn--primary\">Request access\u003c/button>\n    \u003c/form>\n    \u003cp class=\"report-note rv\">No spam. Your data is private. Unsubscribe anytime.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003cfooter class=\"footer\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"footer__brand\">VITAE · Longevity Science\u003c/div>\n    \u003cp class=\"footer__note\">Nothing on this page is medical or investment advice. Longevity and biotech research is early-stage and involves significant risk, including total loss. For accredited / sophisticated investors only.\u003c/p>\n    \u003cdiv class=\"footer__copy\">© 2026 VITAE\u003c/div>\n  \u003c/div>\n\u003c/footer>\n\n\u003cscript>\n  var pb=document.getElementById('progress');\n  window.addEventListener('scroll',function(){var h=document.documentElement;var sc=h.scrollTop||document.body.scrollTop;var m=h.scrollHeight-h.clientHeight;pb.style.width=(m>0?sc/m*100:0)+'%';},{passive:true});\n  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.12});\n  document.querySelectorAll('.rv').forEach(function(el){io.observe(el)});\n  function countUp(el){var t=parseFloat(el.dataset.count);var dec=parseInt(el.dataset.dec||'0',1 e\" class=\"nav__back\">← back\u003c/a>\n  \u003c/div>\n\u003c/nav>\n\n\u003cheader class=\"article-head\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"article-head__tag\">DeSci · The Thesis\u003c/div>\n    \u003ch1 class=\"article-head__title\">Why most molecules die before the clinic\u003c/h1>\n    \u003cp class=\"article-head__dek\">The failure rate isn't a bug. It's the reason early access is where the edge lives.\u003c/p>\n    \u003cdiv class=\"article-meta\">\u003cspan>6 min read\u003c/span>\u003cspan>Updated Nov 2026\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/header>\n\n\u003carticle class=\"article-body\">\n  \u003cdiv class=\"container\">\n    \u003cp class=\"lead\">Roughly nine in ten drug candidates never make it from the lab to the patient. Most die in the \"valley of death\" — the stretch between an exciting preclinical result and proof that it works in humans. If you're coming from investing, this number sounds terrifying. If you're coming from biotech, it's just Tuesday.\u003c/p>\n\n    \u003cp>The instinct is to read the failure rate as a reason to stay out. That instinct is wrong — or at least, it's the wrong frame. The failure rate is exactly why the \u003cstrong>entry point\u003c/strong> matters more than the odds.\u003c/p>\n\n    \u003ch2>The valley of death\u003c/h2>\n    \u003cp>Between a molecule that works in a dish and a molecule that works in a person sits years of trials, hundreds of patients, and a mountain of capital. This is where good ideas go to die — not because the science was wrong, but because the funding and the patience ran out.\u003c/p>\n\n    \u003cp>Traditional biotech handles this by concentrating risk: one company, one lead candidate, one binary outcome. You either own the company that clears the clinic, or you own the company that doesn't. There's very little in between.\u003c/p>\n\n    \u003cdiv class=\"pull\">You don't bet on one molecule. You hold the pipeline.\u003c/div>\n\n    \u003ch2>Early is where the edge lives\u003c/h2>\n    \u003cp>The reason early-stage is where the returns concentrate is simple: that's where the risk is priced highest, and where access is rarest. By the time a candidate is de-risked enough for the public markets, most of the move has happened.\u003c/p>\n\n    \u003cp>DeSci changes the access, not the biology. Instead of waiting years to buy a single company's stock, you can hold a position across a \u003cstrong>pipeline\u003c/strong> — several programs at different stages — so the binary risk of any one molecule becomes a portfolio of them.\u003c/p>\n\n    \u003ch2>Liquidity changes the math\u003c/h2>\n    \u003cp>The old objection to early biotech wasn't the science — it was the \u003cstrong>lock-up\u003c/strong>. A decade, sometimes more, with no way out. DeSci's real contribution is making that position liquid: you can exit when your thesis changes, rather than waiting for an IPO that may never come.\u003c/p>\n\n    \u003cp>None of this makes failure pleasant. It just makes it \u003cem>investable\u003c/em>. You stop asking \"will this one molecule work\" — an unknowable — and start asking \"am I positioned across the science that might.\" That's the question the pipeline answers.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003csection class=\"keep\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"keep__label\">Keep reading\u003c/div>\n    \u003cdiv class=\"keep__grid\">\n      \u003ca class=\"keep-card\" href=\"#p=article-2\">\u003cdiv class=\"keep-card__tag\">Explainers\u003c/div>\u003cdiv class=\"keep-card__title\">What an IP-NFT actually is\u003c/div>\u003cdiv class=\"keep-card__more\">Three words, no jargon →\u003c/div>\u003c/a>\n      \u003ca class=\"keep-card\" href=\"#p=home\">\u003cdiv class=\"keep-card__tag\">Overview\u003c/div>\u003cdiv class=\"keep-card__title\">Back to VITAE\u003c/div>\u003cdiv class=\"keep-card__more\">The landing page →\u003c/div>\u003c/a>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u ">What an IP-NFT actually is\u003c/h1>\n    \u003cp class=\"article-head__dek\">Three words that turned biotech into something you can hold — explained without the jargon.\u003c/p>\n    \u003cdiv class=\"article-meta\">\u003cspan>5 min read\u003c/span>\u003cspan>Updated Nov 2026\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/header>\n\n\u003carticle class=\"article-body\">\n  \u003cdiv class=\"container\">\n    \u003cp class=\"lead\">You keep hearing it: IP-NFT. It sounds like a contradiction — a piece of science you can own, a patent you can trade. Strip away the acronym and the idea is almost obvious.\u003c/p>\n\n    \u003ch2>Start with the IP\u003c/h2>\n    \u003cp>Every drug starts as \u003cstrong>intellectual property\u003c/strong> — a patent on a molecule, a dataset, a method. That IP is the actual asset. The pill is just the product that eventually falls out of it. For decades, the IP lived locked in a company's balance sheet, owned by whoever funded the lab.\u003c/p>\n\n    \u003cp>That's the part worth understanding: the value was never the bottle. It was the \u003cstrong>claim on the discovery\u003c/strong>. And a claim is exactly the kind of thing that can be represented, split, and transferred.\u003c/p>\n\n    \u003ch2>Then the NFT part\u003c/h2>\n    \u003cp>An NFT is just a record of ownership that lives on-chain — unforgeable, transferable, auditable. Attach one to a piece of biotech IP and you get a \u003cstrong>tokenized claim\u003c/strong>: a stake in a specific research program that can be held, tracked, and sold.\u003c/p>\n\n    \u003cp>This doesn't make the science faster or the molecule safer. It changes one thing, and it's the thing that mattered: \u003cstrong>who gets to hold the position, and whether they can exit.\u003c/strong>\u003c/p>\n\n    \u003cdiv class=\"pull\">The value was never the bottle. It was the claim on the discovery.\u003c/div>\n\n    \u003ch2>What you actually own\u003c/h2>\n    \u003cp>You don't own a test tube. You own the economic interest in the IP — the right to share in what that program becomes. If the science advances and the program appreciates, your position tracks it. If you want out, you don't wait a decade; the position is liquid.\u003c/p>\n\n    \u003cp>There's a legal wrapper underneath all of it — a fund or a DAO that holds the underlying IP and issues the tokens. You hold the token; the structure holds the asset. That separation is what makes a locked, illiquid asset into something that can finally move.\u003c/p>\n\n    \u003ch2>The honest caveat\u003c/h2>\n    \u003cp>Liquid does not mean safe. Early-stage biotech fails often, and a tokenized position can go to zero like any other early bet. What the IP-NFT gives you is not certainty — it's \u003cem>access and exit\u003c/em>, the two things early science never used to offer. For the right, long-horizon holder, that's the whole difference.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003csection class=\"keep\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"keep__label\">Keep reading\u003c/div>\n    \u003cdiv class=\"keep__grid\">\n      \u003ca class=\"keep-card\" href=\"#p=article-1\">\u003cdiv class=\"keep-card__tag\">The thesis\u003c/div>\u003cdiv class=\"keep-card__title\">Why most molecules die before the clinic\u003c/div>\u003cdiv class=\"keep-card__more\">The failure rate isn't a bug →\u003c/div>\u003c/a>\n      \u003ca class=\"keep-card\" href=\"#p=home\">\u003cdiv class=\"keep-card__tag\">Overview\u003c/div>\u003cdiv class=\"keep-card__title\">Back to VITAE\u003c/div>\u003cdiv class=\"keep-card__more\">The landing page →\u003c/div>\u003c/a>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cfooter class=\"footer\">\n  \u003cdiv class=\"container footer__inner\">\n    \u003cdiv>\n      \u003cdiv class=\"footer__brand\" style=\"font-family:var(--display);font-weight:600;letter-spacing:.18em;font-size:14px\">VITAE · Longevity Science\u003c/div>\n      \u003cp class=\"footer__note\">Nothing on
